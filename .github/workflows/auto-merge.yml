name: Dependabot auto-merge

permissions:
  contents: read

on:
  pull_request:

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
    uses: go-openapi/ci-workflows/.github/workflows/auto-merge.yml@1c2020082c9b8a77fde4090b0b7fe46315b31d2e # v0.6.4
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
