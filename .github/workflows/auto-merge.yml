name: Dependabot auto-merge

permissions:
  contents: read

on:
  pull_request:

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
    uses: go-openapi/ci-workflows/.github/workflows/auto-merge.yml@a673fdc66cb2e751f009c47f78e3ac4cc13f815b # v0.5.2
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
