name: Dependabot auto-merge

permissions:
  contents: read

on:
  pull_request:

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
    uses: go-openapi/ci-workflows/.github/workflows/auto-merge.yml@692da2dae8f16666dea2392b18ad73130fbf738e # v0.6.5
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
