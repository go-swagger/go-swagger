name: Update documentation site

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-doc:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          submodules: recursive
          sparse-checkout: |
            hack/
            docs/
      -
        name: Get all tags (go-swagger repo)
        if: ${{ github.repository == 'go-swagger/go-swagger' }}
        run: |
          git fetch origin --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
      -
        name: Get all tags (fork)
        if: ${{ github.repository != 'go-swagger/go-swagger' }}
        run: |
          git remote add upstream "https://github.com/go-swagger/go-swagger"
          git fetch upstream --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
          git fetch origin --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
      -
        name: Initialize themes
        run: |
          (cd hack/doc-site/hugo/ && git clone --branch v9 https://github.com/alex-shpak/hugo-book themes/hugo-book)
      -
        name: Prepare config
        run: |
          # Builds a commit-dependant extra config to inject parameterization.
          # HUGO doesn't support config from the command line.
          #
          # Set go-swagger specific parameters that are used in some parameterized documents
          # This is used to keep up-to-date installation instructions.
          #
          # TODO(fredbi):
          #
          # Support a versioned doc site with latest master and up to 5 latest releases online.
          #
          # - [ ] use github releases to store archived versions of doc site
          # - [ ] use relearn theme to manage a versioned doc site
          # - [ ] inject below the logic to fetch n most recent versions of the site we want to
          #   publish (from github releases), arrange the layout then complete the build
          cd hack/doc-site/hugo
          LATEST_RELEASE=$(git tag --list --sort -version:refname -i 'v*'|head -1)
          VERSION_MESSAGE="Documentation set for latest master."
          ROOT=$(git rev-parse --show-toplevel)
          REQUIRED_GO_VERSION=$(grep "^go\s" "${ROOT}"/go.mod|cut -d" " -f2)
          printf \
          "params:\n  goswagger:\n    goVersion: '%s'\n    latestRelease: '%s'\n    versionMessage: '%s'\n" \
          "${REQUIRED_GO_VERSION}" "${LATEST_RELEASE}" "${VERSION_MESSAGE}" > goswagger.yaml
      -
        name: Install Hugo
        env:
          HUGO_VERSION: '0.123.8'  # <- pin the HUGO version, as they often break things
          # sha256 of the archive below, from hugo_0.123.8_checksums.txt in the same release
          HUGO_SHA256: 0a449715f29a240c6f461d040516dd2360b0b80964986cedde1f35f2c330ab7c
        run: |
          # Extended build for linux x64: the archive crazy-max/ghaction-hugo used to download.
          # That action is archived, so the download is done here and checked before use.
          archive="hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/hugo/hugo" version
      -
        name: Build site with Hugo
        run: |
          hugo --config hugo.yaml,goswagger.yaml --buildDrafts --cleanDestinationDir --minify --printPathWarnings --ignoreCache --noBuildLock --logLevel info --source "${GITHUB_WORKSPACE}/hack/doc-site/hugo"
      -
        name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hack/doc-site/hugo/public

      # TODO(fredbi): should be able to render preview

  deploy-doc:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-doc]
    permissions:
      pages: write
      id-token: write
    steps:
      -
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
