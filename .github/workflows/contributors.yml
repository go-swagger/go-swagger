name: Contributors

on:
  schedule:
    - cron: '18 4 4 * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contributors:
    permissions:
      pull-requests: write
      contents: write
    uses: go-openapi/ci-workflows/.github/workflows/contributors.yml@38ed6bf083115440d79b475442d6cf99ee450180 # v0.6.1
    secrets:
      github-app-id: ${{ secrets.CI_BOT_APP_ID }}
      github-app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
      gpg-private-key: ${{ secrets.CI_BOT_GPG_PRIVATE_KEY }}
      gpg-passphrase: ${{ secrets.CI_BOT_GPG_PASSPHRASE }}
      gpg-fingerprint: ${{ secrets.CI_BOT_SIGNING_KEY }}
