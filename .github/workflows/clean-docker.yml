name: Clean docker images

on:
  # weekly cleanup schedule
  schedule:
    - cron: '14 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-docker-untagged:
    # Remove older untagged images (deprecated builds from master)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        delete-untagged: 'true'

  clean-docker-dev:
    # Remove older master builds
    needs: [ clean-docker-untagged ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        delete-tags: 'sha-*'
        older-than: '1 year'
