swagger: "2.0"
info:
  description: 'fixture for --generate-getters: exercise getter return types across field kinds'
  title: generate-getters
  version: "0.0.0"
paths:
  /v1/models:
    get:
      operationId: listModels
      produces:
        - application/json
      parameters:
        - name: "$top"
          in: query
          type: integer
          format: int64
          description: OData $top — an optional scalar query param (int64)
        - name: "$skip"
          in: query
          type: integer
          format: int64
          required: true
          description: OData $skip — a required query param (int64, non-pointer)
        - name: name
          in: query
          type: string
          description: an optional string query param (pointer)
        - name: tags
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
          description: a slice query param
        - name: when
          in: query
          type: string
          format: date-time
          description: a date-time query param (strfmt.DateTime)
      responses:
        default:
          description: model list
          schema:
            type: array
            items:
              $ref: '#/definitions/GetterModel'

definitions:
  GetterModel:
    type: object
    required:
      - name
    properties:
      id:
        type: integer
        format: int64
        description: an optional scalar (int64)
      name:
        type: string
        description: a required string (generated as a pointer)
      tags:
        type: array
        items:
          type: string
        description: a slice of strings
      when:
        type: string
        format: date-time
        description: a date-time field (strfmt.DateTime)
      child:
        $ref: '#/definitions/Child'
        description: a nested object (pointer to struct)
      active:
        type: boolean
        description: a boolean field
      ratio:
        type: number
        format: float
        description: a float field
      metadata:
        type: object
        additionalProperties:
          type: string
        description: a map of string to string (additionalProperties)
      pet:
        $ref: '#/definitions/Pet'
        description: a polymorphic base type property (exercises the IsBaseType guard)

  Child:
    type: object
    properties:
      label:
        type: string
        description: a label for the child

  Pet:
    type: object
    discriminator: kind
    required:
      - kind
    properties:
      kind:
        type: string
        description: the discriminator field
      name:
        type: string
        description: the pet name

  Dog:
    type: object
    allOf:
      - $ref: '#/definitions/Pet'
      - type: object
        properties:
          breed:
            type: string
            description: the dog breed
